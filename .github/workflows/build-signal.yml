name: build-signal

on:
  push:
    branches: [wifi-scan-fix-2026-10-15]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install arduino-cli
        run: |
          curl -fsSL -o /tmp/acli.tar.gz https://github.com/arduino/arduino-cli/releases/download/v1.1.1/arduino-cli_1.1.1_Linux_64bit.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/acli.tar.gz -C "$HOME/.local/bin" arduino-cli
          "$HOME/.local/bin/arduino-cli" version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: esp32 core and libraries (pinned)
        run: |
          arduino-cli config init --overwrite >/dev/null
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install "GFX Library for Arduino@1.6.7" "ArduinoJson@7.4.3" "XPowersLib@0.3.3"
          curl -fsSL -o /tmp/ai2s.zip https://github.com/schreibfaul1/ESP32-audioI2S/archive/refs/tags/4.0.0.zip
          arduino-cli lib install --zip-path /tmp/ai2s.zip
          arduino-cli core list
          arduino-cli lib list

      - name: compile the SIGNAL sketch
        run: |
          FQBN='esp32:esp32:esp32s3:PSRAM=opi,FlashSize=32M,PartitionScheme=huge_app,UploadSpeed=921600,USBMode=default,CDCOnBoot=cdc'
          arduino-cli compile --fqbn "$FQBN" --output-dir out firmware/ESP32S3_WEB_RADIO
          ls -l out
          sha256sum out/ESP32S3_WEB_RADIO.ino.bin

      - name: upload the image
        uses: actions/upload-artifact@v4
        with:
          name: signal-v3-bin
          path: out/ESP32S3_WEB_RADIO.ino.bin
          if-no-files-found: error
